<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eva's Words">
<meta name="theme-color" content="#ff8fc0">
<title>Eva's World of Words</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E">
<style>
:root{--p50:#fff6fa;--p100:#ffe6f1;--p200:#ffcfe4;--p300:#ffa6cd;--p400:#ff78b3;--p500:#f2509a;--berry:#c2185b;--ink:#5a1f45;--muted:#8a5a77;--lilac:#c9a8ff;--mint:#aee9d1;--gold:#ffd24a;--peach:#ffc9a3;--sky:#8fd3ff;--r:26px}
*{box-sizing:border-box}
html{background:var(--p100);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Nunito","Quicksand","Varela Round","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;color:var(--ink);font-size:17px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom);
 background:radial-gradient(circle at 12px 12px,#ffffff88 3px,#0000 4px) 0 0/34px 34px,linear-gradient(180deg,#ffeaf4 0,#fff6fa 50%,#ffe2ef 100%);background-attachment:scroll}
body[data-scene=stage1]{background:radial-gradient(circle at 12px 12px,#ffffff88 3px,#0000 4px) 0 0/34px 34px,linear-gradient(180deg,#ffe7f2 0,#f1fff6 100%)}
body[data-scene=stage2]{background:radial-gradient(circle at 12px 12px,#ffffff66 3px,#0000 4px) 0 0/34px 34px,linear-gradient(180deg,#eadfff 0,#ffe6f1 100%)}
body[data-scene=stage3]{background:radial-gradient(circle at 12px 12px,#ffffff77 3px,#0000 4px) 0 0/34px 34px,linear-gradient(180deg,#fff0e4 0,#ffe3ee 100%)}
body[data-scene=parent]{background:#fff7fb}
button{font:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;user-select:none;-webkit-user-select:none}
header#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 4%;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(180deg,#ff9fcb,#ff7fb8);border-bottom:5px solid #fff;box-shadow:0 5px 0 #ffc2dd;color:#fff}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;font-weight:900;font-size:1.2rem;text-shadow:0 2px 0 #c2185b66;padding:0;min-height:48px}
.brand b{color:#fff7b8}.logo{width:46px;height:46px;background:#fff;border-radius:50%;display:grid;place-items:center;border:3px solid #fff;overflow:hidden;box-shadow:0 2px 0 #c2185b44}.logo .kit{width:46px;height:46px;animation:none;margin-top:6px}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hudi{background:#fff;color:var(--berry);border-radius:30px;padding:7px 14px;font-weight:900;box-shadow:0 3px 0 #ffc2dd}
.hbtn{border:0;background:#fff;color:var(--berry);border-radius:30px;padding:9px 14px;font-weight:900;min-height:44px;box-shadow:0 3px 0 #ffc2dd}
main{max-width:1120px;margin:auto;padding:22px 16px 60px}
h1{font-size:clamp(1.7rem,4.6vw,2.6rem);margin:6px 0;line-height:1.1}h2{margin:4px 0 8px;font-size:1.35rem}h3{margin:6px 0}
.muted{color:var(--muted)}small.muted{font-weight:600}

/* buttons */
.btn{border:0;border-radius:22px;padding:13px 22px;min-height:52px;background:linear-gradient(180deg,#ff8fc4,var(--p500));color:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 6px 0 #c2185b;text-shadow:0 2px 0 #c2185b55;transition:transform .12s,filter .12s}
@media(hover:hover){.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2185b}
.btn.alt{background:#fff;color:var(--berry);border:3px solid var(--p300);box-shadow:0 5px 0 #ffb3d4;text-shadow:none}
.btn.gold{background:linear-gradient(180deg,#ffe27a,var(--gold));color:#6a4300;box-shadow:0 6px 0 #d99a1e;text-shadow:none}
.btn.danger{background:linear-gradient(180deg,#ff8a9e,#e8456a);box-shadow:0 5px 0 #a82746}
.btn.big{font-size:1.25rem;padding:16px 32px}.btn.sm{padding:9px 16px;min-height:44px;font-size:.95rem}.btn.xs{padding:5px 11px;min-height:34px;font-size:.82rem;border-radius:14px;box-shadow:0 3px 0 #c2185b}
.btn.alt.xs{box-shadow:0 3px 0 #ffb3d4}.btn.play{animation:pulse 1.8s ease-in-out infinite}
.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}.cta.left{justify-content:flex-start}.result .cta,.pin .cta{justify-content:center}

/* hero */
.hero{position:relative;border-radius:34px;overflow:hidden;border:6px solid #fff;box-shadow:0 8px 0 #ffb3d4,0 20px 40px #f2509a33;min-height:440px;background:#ffe6f1}
.hero-art{position:absolute;inset:0}.hero-art svg{width:100%;height:100%;display:block}
.hero-in{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:clamp(20px,4vw,44px);min-height:430px}
.hero-text{max-width:560px;position:relative;z-index:2}
.hero-text h1{font-size:clamp(2.6rem,8vw,4.6rem);text-shadow:0 4px 0 #fff}.hero-text h1 b{color:var(--p500)}
.hero-text p{font-size:1.15rem;line-height:1.55;background:#ffffffcc;border-radius:18px;padding:10px 14px;display:inline-block}
.eyebrow{display:inline-block;background:#fff;color:var(--berry);border-radius:30px;padding:7px 16px;font-weight:900;font-size:.9rem;box-shadow:0 3px 0 #ffc2dd}
.hero-kit{position:relative;width:min(300px,38vw);flex:none;z-index:2}.hero-kit .kit{width:100%;animation:float 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 #c2185b22)}
.bub{position:relative;background:#fff;border:3px solid var(--p300);border-radius:22px;padding:10px 14px;font-weight:800;color:var(--berry);box-shadow:0 4px 0 #ffc2dd;margin-bottom:14px;text-align:center;line-height:1.3}
.bub:after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:#fff;border-right:3px solid var(--p300);border-bottom:3px solid var(--p300);transform:translateX(-50%) rotate(45deg)}
.kit{display:block;width:100%;height:auto;overflow:visible}.kit .eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}.kit-cheer{animation:hop .7s ease-out}.wing{animation:flap 1.4s ease-in-out infinite;transform-origin:100px 150px}.wand{animation:wave 1.6s ease-in-out infinite;transform-origin:150px 188px}

/* stats / cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:22px}
.stat{background:#fff;border:4px solid var(--p200);border-radius:24px;padding:14px;text-align:center;box-shadow:0 5px 0 #ffd6e8}.stat span{font-size:2rem}.stat b{display:block;font-size:1.8rem;color:var(--p500)}.stat small{color:var(--muted);font-weight:800}
.mission{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#fff3c4,#ffe0ef);border:4px solid #fff;border-radius:26px;padding:16px 22px;margin-top:20px;box-shadow:0 5px 0 #ffd6e8}.mission h2,.mission p{margin:2px 0}
.card,.gcard{background:#fff;border:4px solid var(--p200);border-radius:var(--r);padding:20px;box-shadow:0 6px 0 #ffd6e8;margin-top:18px}
.notice{background:#fff7d6;border:3px solid #f3df8a;color:#6d5300;border-radius:18px;padding:12px 16px;margin-top:16px}.good{background:#e8fbf0;border:3px solid #b6ebcc;color:#136a40;border-radius:18px;padding:12px 16px;margin-top:12px;font-weight:700}
.head{margin:2px 0 20px}.head p{margin:2px 0}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-weight:800;font-size:.92rem;margin-bottom:6px}.crumb{background:#ffffffcc;border:2px solid var(--p200);color:var(--berry);border-radius:20px;padding:5px 12px;min-height:34px}.crumb.cur{background:var(--p400);color:#fff;border-color:var(--p400)}.sep{color:var(--p400);font-weight:900}
.kitrow{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px}.guide.mini{width:90px;flex:none}.kitrow .bub{margin:0 0 10px;text-align:left;flex:1;max-width:420px;padding-left:24px}.kitrow .bub:after{left:-8px;bottom:14px;transform:rotate(135deg)}

/* theme / week / stage cards */
.tgrid,.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.tcard,.wcard{background:linear-gradient(160deg,var(--b),#fff);border:5px solid var(--a);border-radius:30px;padding:16px 18px;text-align:center;color:var(--ink);box-shadow:0 7px 0 var(--a);transition:transform .15s}
@media(hover:hover){.tcard:hover,.wcard:hover,.scardbtn:hover{transform:translateY(-5px) rotate(-.7deg)}}
.tcard:active,.wcard:active,.scardbtn:active{transform:translateY(3px)}
.tic{font-size:3.1rem;animation:bob 2.6s ease-in-out infinite}.tnum,.wnum{font-size:1.65rem;font-weight:900;color:var(--berry)}.tmeta{font-weight:800;color:var(--muted);margin:2px 0 6px}.tstars{font-weight:900;margin:4px 0}.pct{font-size:.85rem;font-weight:800;color:var(--muted);margin-top:3px}
.dotsrow{display:flex;gap:8px;justify-content:center;margin:6px 0}.sdot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #eadce4;filter:grayscale(1);opacity:.55}.sdot.on{filter:none;opacity:1;border-color:var(--gold);background:#fff8d6}
.bar{height:16px;background:#fff;border:3px solid #fff;border-radius:20px;overflow:hidden;box-shadow:inset 0 2px 3px #c2185b22;margin-top:6px}.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--p400) 0 12px,#ff9fcb 12px 24px);border-radius:20px;transition:width .5s}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.scardbtn{border-radius:32px;padding:20px 16px;text-align:center;color:var(--ink);border:6px solid #fff;box-shadow:0 8px 0 var(--sh,#ffb3d4);transition:transform .15s;display:flex;flex-direction:column;align-items:center}
.scardbtn.st1{background:linear-gradient(180deg,#d9f7e4,#ffe0ef);--sh:#8fd8ae}.scardbtn.st2{background:linear-gradient(180deg,#e7dcff,#ffd9ec);--sh:#c3a8f5}.scardbtn.st3{background:linear-gradient(180deg,#fff0d9,#ffd9ec);--sh:#f5c28f}
.sic{font-size:3.4rem;animation:bob 2.6s ease-in-out infinite}.snum2{font-weight:900;color:var(--p500);text-transform:uppercase;letter-spacing:1px;font-size:.85rem}.scardbtn h2{margin:2px 0}.place{font-weight:800;color:var(--muted);font-size:.9rem}.scardbtn p{min-height:50px;margin:8px 0}.scardbtn .bar{width:100%}
.go{margin-top:10px;background:var(--p500);color:#fff;border-radius:20px;padding:9px 26px;font-weight:900;box-shadow:0 4px 0 #c2185b}
.starrow,.bigstars{font-size:1.8rem;letter-spacing:3px}.st{color:#e8d4de}.st.on{color:var(--gold);text-shadow:0 2px 0 #d99a1e}.bigstars{font-size:3.6rem;animation:pop .7s}

/* game */
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.banner{position:relative;aspect-ratio:1200/230;min-height:110px;max-height:210px;border-radius:30px;overflow:hidden;border:5px solid #fff;box-shadow:0 6px 0 #ffd0e5}.banner svg{width:100%;height:100%;display:block}
.bt{position:absolute;left:14px;top:12px}.bt span{background:#ffffffe8;color:var(--berry);font-weight:900;border-radius:30px;padding:6px 18px;box-shadow:0 3px 0 #ffc2dd}
.pdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 0}.pd{font-size:1.5rem;color:#ffd6e8;transition:transform .2s}.pd.done{color:var(--p500)}.pd.cur{color:var(--gold);transform:scale(1.3);text-shadow:0 2px 0 #d99a1e}
.gwrap{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:start;margin-top:6px}
.guide{position:sticky;top:96px;padding-top:12px}.guide .kit{width:100%;filter:drop-shadow(0 6px 0 #c2185b1a)}
.gcard{margin-top:12px;text-align:center;padding:clamp(16px,3vw,28px);border-width:5px}
.prompt{font-weight:900;font-size:1.3rem;color:var(--berry);margin-bottom:8px}.pgn{font-size:.9rem;color:var(--muted)}
.bigword{font-size:clamp(2.6rem,8vw,4.4rem);font-weight:900;margin:8px 0 12px;background:linear-gradient(90deg,#f2509a,#b66dff,#ff8a5c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;word-break:break-word}.bigword.en{font-size:clamp(1.8rem,5.4vw,3rem)}
.opts3,.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px}
.opt{min-height:60px;min-width:130px;max-width:100%;padding:12px 20px;border-radius:22px;font-weight:900;font-size:1.15rem;color:var(--ink);border:4px solid;transition:transform .12s}
.opts3 .opt{flex:1 1 150px;max-width:260px;min-height:70px;font-size:1.25rem}
.opt.c0{background:#ffe3f0;border-color:#ff9fc8;box-shadow:0 5px 0 #ff9fc8}.opt.c1{background:#e9e0ff;border-color:#c9a8ff;box-shadow:0 5px 0 #c9a8ff}.opt.c2{background:#fff1c9;border-color:#ffd24a;box-shadow:0 5px 0 #e6b72c}
@media(hover:hover){.opt:hover:not(:disabled){transform:translateY(-3px) scale(1.03)}}
.opt.good{background:#c9f5dc!important;border-color:#3cc27a!important;box-shadow:0 5px 0 #2a9a5f!important;animation:pop .5s}.opt.bad{background:#ffd9e0!important;border-color:#ee5f7e!important;box-shadow:none!important;animation:shake .4s;opacity:.7}.opt.on{outline:5px solid var(--lilac);transform:scale(1.05)}.opt:disabled{cursor:default}
.fb{font-weight:900;font-size:1.2rem;min-height:30px;margin:10px 0 2px}.fb.good{color:#16804a;background:none;border:0;padding:0;margin-top:10px}.fb.bad{color:#c2315b;background:none;border:0;padding:0;margin-top:10px}.hint{font-weight:800;color:#8d5f00;min-height:22px}
.nextrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.clue{margin:8px 0 14px;font-size:1.25rem}.pill{display:inline-block;background:var(--p400);color:#fff;border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;vertical-align:middle;margin-right:4px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;align-items:center}
.slot{width:54px;height:62px;border-radius:16px;border:4px dashed var(--p300);background:#fff8fc;font-size:1.9rem;font-weight:900;color:var(--ink);padding:0;display:grid;place-items:center}
.slot.f{border-style:solid;background:#fff;border-color:var(--p400)}.slot.fixed{background:#efe6ff;border:4px solid #c9a8ff;color:#6b43c9}.slot.lock{background:#fff3c4;border:4px solid var(--gold)}
.slot.good{background:#c9f5dc;border-color:#3cc27a;animation:pop .4s}.slot.bad{background:#ffd9e0;border-color:#ee5f7e;animation:shake .4s}.slot.reveal{background:#fff3c4;border-color:var(--gold)}.gap{width:24px}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 4px;padding:14px;background:linear-gradient(180deg,#ffeaf4,#fff);border-radius:24px;border:3px dashed var(--p200)}
.tile{width:58px;height:64px;border-radius:18px;border:0;font-size:2rem;font-weight:900;color:#fff;padding:0;text-shadow:0 2px 0 #0003;transition:transform .12s}
.tile.t0{background:linear-gradient(180deg,#ff9fc8,#f2509a);box-shadow:0 6px 0 #c2185b}.tile.t1{background:linear-gradient(180deg,#c9a8ff,#8f63e8);box-shadow:0 6px 0 #5f3db0}.tile.t2{background:linear-gradient(180deg,#ffd24a,#ffa930);box-shadow:0 6px 0 #c47a10}.tile.t3{background:linear-gradient(180deg,#8fd3ff,#3fa6e8);box-shadow:0 6px 0 #1f72a8}.tile.t4{background:linear-gradient(180deg,#8fe6b8,#3cc27a);box-shadow:0 6px 0 #1f8a52}
.tile:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #0004}.tile:disabled{opacity:.18;box-shadow:none}
.scard{position:relative;text-align:left;background:linear-gradient(180deg,#fff,#fff7fb);border:4px solid var(--p300);border-radius:24px;padding:16px 16px 12px 62px;margin:14px 0;box-shadow:0 5px 0 #ffc2dd}
.snum{position:absolute;left:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--p500);color:#fff;font-weight:900;display:grid;place-items:center;font-size:1.2rem;box-shadow:0 3px 0 #c2185b}
.sline{font-size:1.35rem;font-weight:800;line-height:2.4;word-break:break-word}.lab{color:var(--muted);font-size:1rem}
input.blank{display:inline-block;font:inherit;font-weight:900;text-align:center;color:var(--ink);background:#fff3c4;border:0;border-bottom:5px dashed var(--p400);border-radius:12px 12px 0 0;padding:2px 6px;margin:0 4px;max-width:100%}
input.blank:focus{outline:none;background:#ffe9a0;border-bottom-color:#8f63e8}input.blank.ok{background:#c9f5dc;border-bottom:5px solid #3cc27a;color:#0f7a43}input.blank.bad{background:#ffd9e0;border-bottom:5px solid #ee5f7e;color:#b5224d}
.fix{display:inline-block;background:#d8f8e3;color:#136a40;font-weight:900;border-radius:12px;padding:1px 10px;font-size:1rem;margin-left:4px;line-height:1.7}
.or{font-size:.82rem;font-weight:800;color:var(--muted)}.scard .opts{justify-content:flex-start;margin:6px 0}.scard .opt{min-height:48px;min-width:90px;padding:8px 16px;font-size:1.05rem}
.srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}.res{font-weight:900}.res.good{color:#16804a}.res.bad{color:#c2315b}

/* result */
.result{text-align:center;background:#fff;border:6px solid #fff;border-radius:34px;box-shadow:0 8px 0 #ffb3d4;padding:24px 18px;background:linear-gradient(180deg,#fff,#ffeaf4)}.kitbig{width:min(230px,56vw);margin:0 auto}.kitbig .kit{animation:float 2.8s ease-in-out infinite}
.rs{font-size:1.2rem}.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}.chip{background:#fff;border:3px solid var(--p200);color:var(--berry);border-radius:30px;padding:6px 16px;font-weight:900}
.newbadge{display:flex;gap:12px;align-items:center;justify-content:center;background:linear-gradient(90deg,#fff3c4,#ffe0ef);border:3px solid var(--gold);border-radius:22px;padding:10px 16px;margin:10px auto;max-width:460px;text-align:left;animation:pop .6s}.newbadge span{font-size:2.4rem}

/* progress + treasures */
.ptable{display:grid;gap:8px;margin-top:10px}.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--p50);border-radius:16px;padding:8px 12px}.prow b{min-width:90px}.pill2{background:#fff;border:2px solid var(--p200);border-radius:20px;padding:3px 10px;font-weight:800;font-size:.9rem}.stx .st{font-size:.9rem;letter-spacing:0}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.acc{background:var(--p50);border:4px solid var(--p200);border-radius:22px;padding:10px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}.acc.eq{border-color:var(--gold);background:#fff8d6}.acc.lock{opacity:.5}.accpic{width:96px}.accpic .kit{animation:none}
.garden{display:grid;gap:8px}.grow{display:flex;flex-wrap:wrap;align-items:center;gap:2px;background:linear-gradient(180deg,#fff,#effdf4);border-radius:18px;padding:6px 10px;border:2px solid #d3f3e0}.grow b{min-width:70px}.fl{width:34px;height:34px}.fl.on{animation:sway 3s ease-in-out infinite}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.badge{background:#f6eef2;border:3px dashed #e1ccd8;border-radius:22px;padding:12px;text-align:center;filter:grayscale(1);opacity:.6}.badge.on{background:linear-gradient(180deg,#fff8d6,#ffe6f1);border:3px solid var(--gold);filter:none;opacity:1}.bic{font-size:2.4rem}.badge small{display:block;color:var(--muted)}
.spark{animation:twinkle 1.4s ease-in-out infinite}

/* parent */
.pin{max-width:420px;margin:30px auto;text-align:center}.pin input,.card input,.card select,.card textarea,.mbox input,.mbox textarea{width:100%;padding:10px 12px;border:3px solid var(--p200);border-radius:14px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
label{display:block;font-weight:800;margin:10px 0 4px;font-size:.92rem}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.filters select,.filters input{width:auto;flex:1 1 130px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tag{background:var(--p100);border-radius:20px;padding:4px 12px;font-weight:800;font-size:.85rem}.tag.ok{background:#d8f8e3;color:#136a40}.tag.warn{background:#fff1c9;color:#7a5600}.tag.bad{background:#ffd9e0;color:#a8204a}

@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}

<script>
/* ======================  ART: original kitten + scenes (all inline SVG)  ====================== */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function flowerSvg(cx,cy,r,petal,center){let p='';for(let i=0;i<5;i++){const a=i*72-90,x=cx+Math.cos(a*Math.PI/180)*r,y=cy+Math.sin(a*Math.PI/180)*r;p+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r*.78).toFixed(1)}" fill="${petal}"/>`}return p+`<circle cx="${cx}" cy="${cy}" r="${(r*.7).toFixed(1)}" fill="${center}"/>`}

const FURS={mimi:{fur:'#fff1de',stripe:'#eab98c',line:'#c18a63',dress:'#ff8fc0'},luna:{fur:'#ece3ff',stripe:'#c5b3f0',line:'#9a86c9',dress:'#c9a8ff'},coco:{fur:'#ffdcc6',stripe:'#f3a97b',line:'#c4764a',dress:'#ffb35c'}};
/* Original kitten character (not a licensed character): coloured fur, tabby stripes, smile, tufted ears */
function kitten(o={}){
 const k=FURS[o.who||'mimi'],fur=k.fur,st=k.stripe,ln=k.line,dress=o.dress||k.dress,mood=o.mood||'happy',acc=o.acc||'collar',ink='#3b2030';
 const sw=`stroke="${ln}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
 let back='';
 if(acc==='wings')back=`<g class="wing"><path d="M64 150 C8 104 4 166 52 178 C34 192 74 204 84 174Z" fill="#fff" stroke="#ffbfdc" stroke-width="3"/><path d="M136 150 C192 104 196 166 148 178 C166 192 126 204 116 174Z" fill="#fff" stroke="#ffbfdc" stroke-width="3"/></g>`;
 const tail=`<path d="M140 184 C184 178 190 128 160 120" fill="none" stroke="${ln}" stroke-width="20" stroke-linecap="round"/><path d="M140 184 C184 178 190 128 160 120" fill="none" stroke="${fur}" stroke-width="14" stroke-linecap="round"/><path d="M140 184 C184 178 190 128 160 120" fill="none" stroke="${st}" stroke-width="14" stroke-linecap="round" stroke-dasharray="5 15"/>`;
 const body=`<ellipse cx="100" cy="172" rx="44" ry="34" fill="${dress}" ${sw}/><ellipse cx="78" cy="196" rx="15" ry="10" fill="${fur}" ${sw}/><ellipse cx="122" cy="196" rx="15" ry="10" fill="${fur}" ${sw}/>`;
 const ears=`<path d="M42 82 C32 54 34 28 46 18 C62 20 80 34 92 50Z" fill="${fur}" ${sw}/><path d="M51 66 C46 48 48 36 52 31 C62 35 72 43 79 52Z" fill="#ffb7d0"/><path d="M158 82 C168 54 166 28 154 18 C138 20 120 34 108 50Z" fill="${fur}" ${sw}/><path d="M149 66 C154 48 152 36 148 31 C138 35 128 43 121 52Z" fill="#ffb7d0"/>`;
 const head=`<ellipse cx="100" cy="100" rx="68" ry="55" fill="${fur}" ${sw}/><path d="M100 48 L100 63 M85 50 L88 63 M115 50 L112 63" stroke="${st}" stroke-width="5" stroke-linecap="round" fill="none"/>`;
 let eyes;
 if(mood==='cheer')eyes=`<path d="M60 104 Q72 88 84 104 M116 104 Q128 88 140 104" fill="none" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`;
 else eyes=`<g class="eyes"><ellipse cx="72" cy="102" rx="10" ry="13" fill="${ink}"/><ellipse cx="128" cy="102" rx="10" ry="13" fill="${ink}"/><circle cx="75.5" cy="96" r="3.6" fill="#fff"/><circle cx="131.5" cy="96" r="3.6" fill="#fff"/><circle cx="69" cy="107" r="1.8" fill="#fff"/><circle cx="125" cy="107" r="1.8" fill="#fff"/></g>`;
 if(mood==='oops')eyes+=`<path d="M58 84 L84 90 M142 84 L116 90" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/><path d="M160 76 q6 10 0 16 q-6 -6 0 -16z" fill="#8fd3ff"/>`;
 let mouth;
 if(mood==='cheer')mouth=`<path d="M86 120 Q100 146 114 120Z" fill="#d6366e" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M93 132 Q100 140 107 132 Q100 128 93 132Z" fill="#ff8fb0"/>`;
 else if(mood==='oops')mouth=`<path d="M90 128 Q100 119 110 128" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
 else mouth=`<path d="M100 119 Q100 128 90 128 M100 119 Q100 128 110 128" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`;
 const face=`${eyes}<ellipse cx="52" cy="122" rx="11" ry="7" fill="#ff9fc0" opacity=".65"/><ellipse cx="148" cy="122" rx="11" ry="7" fill="#ff9fc0" opacity=".65"/><path d="M93 111 Q100 105 107 111 Q100 120 93 111Z" fill="#ff7fa8"/>${mouth}<path d="M40 110 L10 101 M40 119 L8 121 M43 128 L14 140 M160 110 L190 101 M160 119 L192 121 M157 128 L186 140" stroke="${ln}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
 let top='';
 if(acc==='collar')top=`<g transform="translate(100 152)"><path d="M0 0 L-30 -15 L-30 15Z M0 0 L30 -15 L30 15Z" fill="#ff5fa2" ${sw}/><circle r="7" fill="#ff3d8b" ${sw}/><circle cx="-19" cy="-3" r="2.4" fill="#fff"/><circle cx="-18" cy="7" r="2" fill="#fff"/><circle cx="19" cy="-3" r="2.4" fill="#fff"/><circle cx="18" cy="7" r="2" fill="#fff"/></g>`;
 else{top=`<g transform="translate(100 152)"><path d="M-24 -4 Q0 12 24 -4" fill="none" stroke="#ffd24a" stroke-width="5" stroke-linecap="round"/><circle cy="9" r="6" fill="#ffd24a" ${sw}/></g>`}
 if(acc==='flowers'){const fl=[[62,52,'#ff8fc0'],[80,44,'#ffd24a'],[100,41,'#ff5fa2'],[120,44,'#c9a8ff'],[138,52,'#ff8fc0']];top+=`<path d="M56 56 Q100 28 144 56" fill="none" stroke="#6cc08b" stroke-width="5" stroke-linecap="round"/>`+fl.map(f=>flowerSvg(f[0],f[1],6.5,f[2],'#fff6c9')).join('')}
 if(acc==='tiara')top+=`<path d="M68 56 L76 34 L90 48 L100 28 L110 48 L124 34 L132 56Z" fill="#ffd24a" stroke="#d99a1e" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="44" r="5" fill="#ff5fa2" stroke="#d99a1e" stroke-width="2"/><circle cx="78" cy="46" r="3" fill="#8fd3ff"/><circle cx="122" cy="46" r="3" fill="#8fd3ff"/>`;
 if(acc==='glasses')top+=`<g fill="rgba(255,255,255,.28)" stroke="#ff5fa2" stroke-width="4.5"><circle cx="72" cy="102" r="19"/><circle cx="128" cy="102" r="19"/><path d="M91 100 Q100 94 109 100" fill="none"/></g>`;
 if(acc==='wand')top+=`<g class="wand"><path d="M150 188 L176 132" stroke="#ffb5d6" stroke-width="6" stroke-linecap="round"/><path d="M178 112 l5 11 12 1 -9 8 3 12 -11 -6 -11 6 3 -12 -9 -8 12 -1z" fill="#ffd24a" stroke="#d99a1e" stroke-width="2.5" stroke-linejoin="round"/></g>`;
 if(acc==='book')top+=`<g><path d="M62 178 L100 168 L138 178 L138 204 L100 194 L62 204Z" fill="#fff" stroke="${ln}" stroke-width="3"/><path d="M100 168 L100 194" stroke="${ln}" stroke-width="3"/><path d="M70 182 L94 177 M70 190 L94 185 M106 177 L130 182 M106 185 L130 190" stroke="#ff8fc0" stroke-width="2.5" stroke-linecap="round"/></g>`;
 return `<svg class="kit kit-${mood}" viewBox="0 0 200 212" role="img" aria-label="Cute kitten">${back}${tail}${body}${ears}${head}${face}${top}</svg>`}

/* ---------- scene banners ---------- */
const SCN={
garden(){const r=rng(7);let fl='';const cols=[['#ff8fc0','#fff6c9'],['#ffd24a','#ff8fc0'],['#c9a8ff','#fff6c9'],['#ff5fa2','#ffe58a'],['#ffffff','#ffd24a']];
 for(let i=0;i<34;i++){const x=20+i*35+r()*14,y=176+r()*34,s=7+r()*7,c=cols[i%cols.length];fl+=`<g class="sway" style="animation-delay:${(r()*3).toFixed(1)}s;transform-origin:${x}px ${y+30}px"><path d="M${x} ${y+4} L${x} ${y+34}" stroke="#5dbf84" stroke-width="3"/>${flowerSvg(+x.toFixed(1),+y.toFixed(1),s,c[0],c[1])}</g>`}
 return `<svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9ec"/><stop offset="1" stop-color="#fff7fb"/></linearGradient></defs><rect width="1200" height="230" fill="url(#gsky)"/><circle cx="1050" cy="56" r="44" fill="#fff3b0" opacity=".6"/><circle cx="1050" cy="56" r="30" fill="#ffd24a"/><g fill="#fff" opacity=".95"><ellipse cx="190" cy="52" rx="60" ry="20"/><ellipse cx="230" cy="40" rx="42" ry="22"/><ellipse cx="620" cy="36" rx="70" ry="20"/><ellipse cx="670" cy="26" rx="40" ry="18"/></g><path d="M0 170 Q200 120 420 165 T860 160 T1200 150 V230 H0Z" fill="#cdf1d8"/><path d="M0 195 Q300 160 600 192 T1200 185 V230 H0Z" fill="#aee6c4"/>${fl}<g class="bfly" style="animation-duration:7s"><path d="M300 90 q-16 -18 -22 0 q4 18 22 0 q16 -18 22 0 q-4 18 -22 0z" fill="#c9a8ff" stroke="#8c6fd6" stroke-width="2"/></g><g class="bfly" style="animation-duration:9s;animation-delay:-3s"><path d="M860 110 q-14 -16 -20 0 q4 16 20 0 q14 -16 20 0 q-4 16 -20 0z" fill="#ff9fc8" stroke="#d6528d" stroke-width="2"/></g></svg>`},
castle(){const r=rng(11);let st='';for(let i=0;i<46;i++)st+=`<circle class="tw" style="animation-delay:${(r()*4).toFixed(1)}s" cx="${(r()*1200).toFixed(0)}" cy="${(r()*120).toFixed(0)}" r="${(1+r()*2.2).toFixed(1)}" fill="#fff"/>`;
 const tw=(x,w,h,col)=>`<rect x="${x}" y="${230-h}" width="${w}" height="${h}" fill="${col}" stroke="#d6528d" stroke-width="3"/><path d="M${x-8} ${230-h} L${x+w/2} ${230-h-52} L${x+w+8} ${230-h}Z" fill="#ff5fa2" stroke="#d6528d" stroke-width="3" stroke-linejoin="round"/><path d="M${x+w/2} ${230-h-52} v-22" stroke="#d6528d" stroke-width="3"/><path d="M${x+w/2} ${230-h-74} l24 8 -24 8z" fill="#ffd24a" stroke="#d99a1e" stroke-width="2"/><rect x="${x+w/2-6}" y="${230-h+16}" width="12" height="22" rx="6" fill="#ffe9a8" stroke="#d6528d" stroke-width="2"/>`;
 return `<svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="csky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a3ff"/><stop offset=".6" stop-color="#ffb7da"/><stop offset="1" stop-color="#ffe5f1"/></linearGradient></defs><rect width="1200" height="230" fill="url(#csky)"/>${st}<circle cx="170" cy="62" r="30" fill="#fff6c9"/><circle cx="182" cy="56" r="26" fill="#d9c9ff" opacity=".0"/>${tw(430,70,120,'#ffd3e8')}${tw(700,70,120,'#ffd3e8')}${tw(540,120,150,'#ffc0de')}${tw(380,46,84,'#ffe0ef')}${tw(774,46,84,'#ffe0ef')}<path d="M558 230 V196 a42 42 0 0 1 84 0 V230Z" fill="#8c4a78" stroke="#d6528d" stroke-width="3"/><path d="M0 200 Q300 168 600 205 T1200 196 V230 H0Z" fill="#ffd9ec" opacity=".9"/><path d="M0 218 Q400 196 800 218 T1200 214 V230 H0Z" fill="#ffc0de"/></svg>`},
library(){const r=rng(5);let bk='';const cols=['#ff8fc0','#c9a8ff','#ffd24a','#8fd3ff','#ff5fa2','#aee9d1','#ffb35c','#ffffff'];
 [[96,0],[168,1]].forEach(([y,row])=>{let x=row?36:10;while(x<1190){const w=14+r()*14,h=40+r()*30;bk+=`<rect x="${x.toFixed(0)}" y="${(y-h+36).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="3" fill="${cols[Math.floor(r()*cols.length)]}" stroke="#c4764a" stroke-width="2"/>`;x+=w+3}bk+=`<rect x="0" y="${y+36}" width="1200" height="12" fill="#c98e63"/>`});
 let lights='';for(let i=0;i<14;i++){const x=40+i*86;lights+=`<circle class="tw" style="animation-delay:${(i*.3).toFixed(1)}s" cx="${x}" cy="${18+Math.sin(i)*6}" r="6" fill="#ffe58a"/>`}
 return `<svg viewBox="0 0 1200 230" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><rect width="1200" height="230" fill="#fff0e4"/><rect width="1200" height="230" fill="#ffd9ec" opacity=".35"/><path d="M0 18 Q300 42 600 18 T1200 18" fill="none" stroke="#c98e63" stroke-width="2"/>${lights}${bk}<rect x="0" y="214" width="1200" height="16" fill="#ff9fc8"/></svg>`}
};


SCN.hero=function(){const r=rng(21);let fl='',sp='';const cols=[['#ff8fc0','#fff6c9'],['#ffd24a','#ff8fc0'],['#c9a8ff','#fff6c9'],['#ff5fa2','#ffe58a'],['#ffffff','#ffd24a']];
 for(let i=0;i<30;i++){const x=15+i*41+r()*18,y=410+r()*60,s=11+r()*10,c=cols[i%cols.length];fl+=`<g class="sway" style="animation-delay:${(r()*3).toFixed(1)}s;transform-origin:${x.toFixed(0)}px ${(y+40).toFixed(0)}px"><path d="M${x.toFixed(0)} ${(y+6).toFixed(0)} L${x.toFixed(0)} ${(y+48).toFixed(0)}" stroke="#5dbf84" stroke-width="4"/>${flowerSvg(+x.toFixed(1),+y.toFixed(1),s,c[0],c[1])}</g>`}
 for(let i=0;i<14;i++){const x=(i%2?560:20)+r()*(i%2?620:60),y=(i%2?30:250)+r()*(i%2?230:90),g=['💖','✨','⭐','🎀'][i%4];sp+=`<text class="tw" style="animation-delay:${(r()*3).toFixed(1)}s" x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-size="${(18+r()*16).toFixed(0)}">${g}</text>`}
 const cloud=(x,y,s)=>`<g fill="#fff" transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="0" r="30"/><circle cx="36" cy="-12" r="38"/><circle cx="80" cy="0" r="30"/><rect x="-30" y="0" width="140" height="30" rx="15"/></g>`;
 const tw=(x,w,h,col)=>`<rect x="${x}" y="${400-h}" width="${w}" height="${h}" fill="${col}" stroke="#e0679f" stroke-width="3"/><path d="M${x-8} ${400-h} L${x+w/2} ${400-h-58} L${x+w+8} ${400-h}Z" fill="#ff7fb5" stroke="#e0679f" stroke-width="3" stroke-linejoin="round"/><path d="M${x+w/2} ${400-h-58} v-24" stroke="#e0679f" stroke-width="3"/><path d="M${x+w/2} ${400-h-82} l24 8 -24 8z" fill="#ffd24a"/><rect x="${x+w/2-6}" y="${400-h+18}" width="12" height="24" rx="6" fill="#fff1b8" stroke="#e0679f" stroke-width="2"/>`;
 return `<svg viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc6e0"/><stop offset=".7" stop-color="#ffeaf4"/><stop offset="1" stop-color="#fff8fb"/></linearGradient></defs><rect width="1200" height="520" fill="url(#hsky)"/><circle cx="1090" cy="80" r="62" fill="#fff3b0" opacity=".55"/><circle cx="1090" cy="80" r="42" fill="#ffd24a"/>${cloud(210,90,1.1)}${cloud(640,60,.9)}${cloud(930,170,.7)}${sp}<g opacity=".95">${tw(640,70,120,'#ffd9ec')}${tw(810,70,120,'#ffd9ec')}${tw(715,100,160,'#ffc7e1')}<path d="M728 400 V366 a37 37 0 0 1 74 0 V400Z" fill="#b25a8c" stroke="#e0679f" stroke-width="3"/></g><path d="M0 380 Q260 320 520 372 T1040 360 T1200 350 V520 H0Z" fill="#d3f4de"/><path d="M0 430 Q300 392 600 430 T1200 420 V520 H0Z" fill="#b6ebcb"/>${fl}</svg>`};

/* ---------- pink castle for the treasure page (7 theme decorations) ---------- */
function castleTreasure(levels){ // levels[i] = 0 none, 1 earned(>=50%), 2 sparkling(100%)
 const dec=[['🚩',150,70],['🎀',250,150],['🌷',330,205],['💎',600,36],['🎈',870,150],['🦋',950,205],['👑',1050,70]];
 const tw=(x,w,h,col)=>`<rect x="${x}" y="${260-h}" width="${w}" height="${h}" fill="${col}" stroke="#d6528d" stroke-width="3"/><path d="M${x-8} ${260-h} L${x+w/2} ${260-h-56} L${x+w+8} ${260-h}Z" fill="#ff5fa2" stroke="#d6528d" stroke-width="3" stroke-linejoin="round"/><rect x="${x+w/2-6}" y="${260-h+18}" width="12" height="24" rx="6" fill="#ffe9a8" stroke="#d6528d" stroke-width="2"/>`;
 let d='';dec.forEach((x,i)=>{const lv=levels[i]||0;d+=`<text x="${x[1]}" y="${x[2]}" font-size="${lv?44:38}" text-anchor="middle" class="${lv===2?'spark':''}" opacity="${lv?1:.18}" style="filter:${lv?'none':'grayscale(1)'}">${x[0]}</text><text x="${x[1]}" y="${x[2]+24}" font-size="13" font-weight="800" text-anchor="middle" fill="#7a2a57">Theme ${i+1}</text>`});
 return `<svg viewBox="0 0 1200 270" role="img" aria-label="Pink castle"><defs><linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c9ff"/><stop offset="1" stop-color="#ffe5f1"/></linearGradient></defs><rect width="1200" height="270" rx="26" fill="url(#tsky)"/>${tw(450,80,150,'#ffd3e8')}${tw(670,80,150,'#ffd3e8')}${tw(550,100,190,'#ffc0de')}${tw(390,50,100,'#ffe0ef')}${tw(760,50,100,'#ffe0ef')}<path d="M562 260 V214 a38 38 0 0 1 76 0 V260Z" fill="#8c4a78" stroke="#d6528d" stroke-width="3"/><path d="M0 250 Q300 226 600 252 T1200 244 V270 H0Z" fill="#ffc0de"/>${d}</svg>`}

const STORE_KEY='eva_world_of_words_v1';          /* unique namespace: never touches Azi's 'azi_words_game_v1' */
let storageBlocked=false;
const fresh=()=>({ver:1,words:[],progress:{},stageBest:{},points:0,hearts:0,pin:'1234',voice:'fr-CA',sound:true,assign:{},equipped:'collar',badges:{}});
function readStore(){try{const r=localStorage.getItem(STORE_KEY);return r?JSON.parse(r):null}catch(e){storageBlocked=true;return null}}
let data=Object.assign(fresh(),readStore()||{});
const seedWords=()=>VOCAB.map(w=>({...w,sentences:[...w.sentences],approved:true}));
if(!Array.isArray(data.words)||!data.words.length)data.words=seedWords();
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){storageBlocked=true}}
persist();

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const at=(a,p)=>` data-a="${a}"`+(p===undefined?'':` data-p="${esc(JSON.stringify(p))}"`);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const NFC=s=>String(s??'').normalize('NFC');
const nf=s=>NFC(s).trim().toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g,' ');
const noAccent=s=>nf(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
const escRe=x=>x.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- vocabulary access ---------- */
const isActive=w=>w.approved!==false;
const activeWords=()=>data.words.filter(isActive);
const themes=()=>[...new Set(activeWords().map(w=>w.theme))].sort((a,b)=>a-b);
const weeksOf=t=>[...new Set(activeWords().filter(w=>w.theme===t).map(w=>w.week))].sort((a,b)=>a-b);
const wordsOf=(t,k)=>activeWords().filter(w=>w.theme===t&&w.week===k);
const themeWords=t=>activeWords().filter(w=>w.theme===t);
const FIELD={1:'d',2:'s',3:'n'};
const STAGE_NAME={1:'Discover Words',2:'Spelling Adventure',3:'Sentence Master'};
const STAGE_PLACE={1:'Magical Pink Garden',2:'Pink Spelling Castle',3:'Magical Sentence Library'};
const STAGE_ICON={1:'🌸',2:'🏰',3:'📖'};
const STAGE_KIT={1:{who:'mimi',acc:'flowers'},2:{who:'luna',acc:'tiara'},3:{who:'coco',acc:'book'}};
const STAGE_SCENE={1:'garden',2:'castle',3:'library'};
const prog=w=>data.progress[w.id]||(data.progress[w.id]={d:0,s:0,n:0,att:0,ok:0,bad:0});
const progRead=w=>data.progress[w.id]||{d:0,s:0,n:0,att:0,ok:0,bad:0};
const cover=(ws,s)=>ws.length?ws.filter(w=>progRead(w)[FIELD[s]]>0).length/ws.length:0;
const pctOf=ws=>ws.length?Math.round(ws.reduce((a,w)=>{const p=progRead(w);return a+(p.d>0)+(p.s>0)+(p.n>0)},0)/(ws.length*3)*100):0;
const skey=(t,k,s)=>t+'|'+k+'|'+s;
const starsOf=(t,k,s)=>data.stageBest[skey(t,k,s)]||0;
const weekStars=(t,k)=>[1,2,3].reduce((b,s)=>b+starsOf(t,k,s),0);
const themeStars=t=>weeksOf(t).reduce((a,k)=>a+weekStars(t,k),0);
const totalStars=()=>Object.values(data.stageBest).reduce((a,b)=>a+b,0);
const flowers=()=>{const o=[];themes().forEach(t=>weeksOf(t).forEach(k=>{const ws=wordsOf(t,k);[1,2,3].forEach(s=>o.push({t,k,s,done:ws.length>0&&cover(ws,s)===1}))}));return o};
const countF=f=>activeWords().filter(w=>progRead(w)[f]>0).length;
const mastered=()=>activeWords().filter(w=>{const p=progRead(w);return p.d>0&&p.s>0&&p.n>0}).length;

/* ---------- speech + sounds (graceful fallbacks) ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
const vlang=v=>(v.lang||'').replace('_','-');
const frVoice=()=>voices.find(v=>vlang(v)===data.voice)||voices.find(v=>vlang(v).toLowerCase().startsWith('fr'));
const canSpeak=()=>('speechSynthesis' in window)&&!!frVoice();
function speak(text,cb){cb=cb||function(){};if(!text||!/[\p{L}\p{N}]/u.test(String(text))||!('speechSynthesis' in window)){cb();return}
 let done=false;const fin=()=>{if(!done){done=true;cb()}};
 try{const u=new SpeechSynthesisUtterance(text);u.lang=data.voice;u.rate=.85;u.pitch=1.08;const v=frVoice();if(v)u.voice=v;u.onend=fin;u.onerror=fin;window._eu=u;setTimeout(fin,Math.max(2500,String(text).length*150+1500));speechSynthesis.speak(u)}catch(e){fin()}}
function say(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel()}catch(e){}speak(text)}
let AC=null;
function audio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=AC||new C();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,d,v,type){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function beep(){tone(880,0,.4,.4)}
function chime(ok){if(!data.sound)return;if(ok){tone(660,0,.18,.2);tone(880,.12,.18,.2);tone(1320,.26,.3,.18)}else tone(260,0,.28,.16,'triangle')}
function sparkleSound(){if(!data.sound)return;[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.25,.18))}

/* ---------- toast + modal + confetti ---------- */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(html){$('modal').innerHTML=`<div class="mback" ${at('closeModal')}></div><div class="mbox" role="dialog" aria-modal="true">${html}</div>`;$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on');$('modal').innerHTML=''}
function confetti(n){const e=['💖','⭐','🌸','🎀','✨','🌷','💗','🦋'];n=n||24;for(let i=0;i<n;i++){const c=document.createElement('span');c.className='confetti';c.textContent=e[i%e.length];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.5+'s';c.style.fontSize=(18+Math.random()*22)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}

/* ---------- HUD + page shell ---------- */
function updateHud(){const p=$('hp'),h=$('hh'),s=$('hs');if(p)p.textContent=totalStars();if(h)h.textContent=data.hearts;if(s)s.textContent=data.sound?'🔊':'🔇'}
function show(html,scene){document.body.dataset.scene=scene||'home';$('app').innerHTML=html;window.scrollTo(0,0);updateHud();persist()}
const bubble=(msg)=>`<div class="bub" id="bub">${msg}</div>`;
const crumbs=a=>`<nav class="crumbs">${a.map((x,i)=>x.a?`<button class="crumb"${at(x.a,x.p)}>${x.t}</button>`:`<span class="crumb cur">${x.t}</span>`).join('<span class="sep">›</span>')}</nav>`;
const THEME_ST=[{ic:'🌸',a:'#ff9fc8',b:'#ffd6e8'},{ic:'🦋',a:'#c9a8ff',b:'#eadfff'},{ic:'🌷',a:'#ff7fb0',b:'#ffc9de'},{ic:'🍓',a:'#ff8a9e',b:'#ffd3da'},{ic:'🌈',a:'#8fd3ff',b:'#d6f0ff'},{ic:'⭐',a:'#ffd24a',b:'#fff1b8'},{ic:'🎀',a:'#ff5fa2',b:'#ffc4de'}];
const tst=t=>THEME_ST[(t-1)%THEME_ST.length];
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const starRow=(n,max)=>Array.from({length:max},(_,i)=>`<span class="st ${i<n?'on':''}">★</span>`).join('');

 const fl=flowers(),fd=fl.filter(f=>f.done).length,ws=activeWords(),as=data.assign[today()];
 show(`<section class="hero"><div class="hero-art">${SCN.hero()}</div>
 <div class="hero-in"><div class="hero-text"><div class="eyebrow">✨ Learn Words. Discover Magic. Collect Stars! ✨</div>

 ${as&&wordsOf(as.t,as.k).length?`<div class="mission"><div><h2>🎯 Today's mission</h2><p>Theme ${as.t} · Semaine ${as.k} is waiting for you!</p></div><button class="btn gold"${at('goWeek',{t:as.t,k:as.k})}>Let's go!</button></div>`:''}
 ${storageBlocked?'<div class="notice">⚠️ This browser is not allowing the game to save. Ask a grown-up to open the file in Chrome or Edge.</div>':''}`,'home')}

 show(`<div class="head">${crumbs([{t:'🏠 Home',a:'goHome'},{t:'Choose a Theme'}])}<h1>Choose a Theme ✨</h1></div><div class="kitrow"><div class="guide mini">${kitten({who:'mimi',acc:data.equipped,mood:'happy'})}</div>${bubble('Which magical Theme shall we explore today?')}</div>

/* ======================  STAGES: one level each, starts directly  ====================== */
let G=null;
const CHEER=['Wonderful, Eva! 🎉','You did it! ⭐','Magnifique! 💖','Super job! 🌸','Bravo, Eva! 🎀','Yay! 🦋'];
const OOPS=['Try again — you can do it! 💪','Almost! Look closely 👀','Oops! One more try 🌷'];
const INTRO={1:'Listen, look and pick the right answer!',2:'Let\'s spell some magic words! ✨',3:'Read the little stories and find the missing word.'};

function setKit(mood,msg){const g=$('guide');if(!g||!G)return;const k=STAGE_KIT[G.s];g.innerHTML=bubble(msg)+kitten({who:k.who,acc:k.acc,mood})}
function frame(inner){
 const s=G.s,k=STAGE_KIT[s];
 return `<div class="gh">${crumbs([{t:'🏠',a:'goHome'},{t:'Theme '+G.t,a:'goTheme',p:G.t},{t:'Semaine '+G.k,a:'goWeek',p:{t:G.t,k:G.k}},{t:STAGE_ICON[s]+' '+STAGE_NAME[s]}])}<button class="btn alt sm"${at('exitGame')}>✕ Exit</button></div>
 <div class="banner">${SCN[STAGE_SCENE[s]]()}<div class="bt"><span>${STAGE_PLACE[s]}</span></div></div>
 <div class="pdots" aria-label="Progress">${G.items.map((_,i)=>`<span class="pd ${i<G.i?'done':i===G.i?'cur':''}">♥</span>`).join('')}</div>
 <div class="gwrap"><aside class="guide" id="guide">${bubble(G.msg||INTRO[s])}${kitten({who:k.who,acc:k.acc,mood:'happy'})}</aside><section class="gcard">${inner}</section></div>`}

function pickRound(ws,cap,s){const f=FIELD[s];return shuffle(ws.map(w=>[progRead(w)[f]+Math.random()*.9,w]).sort((a,b)=>a[0]-b[0]).slice(0,cap).map(x=>x[1]))}
function startStage({t,k,s}){
 const ws=wordsOf(t,k);if(!ws.length){toast('This Semaine has no words yet. Ask a grown-up to add some.');return}
 G={t,k,s,items:pickRound(ws,{1:10,2:8,3:5}[s],s),i:0,ok:0,first:0,pts:0,locked:false,tries:0,hints:0,units:0,unitsOk:0,wasDone:cover(ws,s)===1,msg:INTRO[s]};
 renderQ()}
function renderQ(){if(!G)return;if(G.i>=G.items.length){roundDone();return}G.locked=false;G.tries=0;G.hints=0;G.msg=INTRO[G.s];({1:q1,2:q2,3:q3})[G.s]()}
function finishItem(w,o){const p=prog(w);p.att++;p.last=new Date().toISOString();if(o.credit){p.ok++;p[FIELD[G.s]]++}else if(!o.ok)p.bad++;
 if(o.ok)G.ok++;if(o.first)G.first++;const h=o.hearts===undefined?(o.first?1:0):o.hearts;data.hearts+=h;data.points+=o.pts||0;G.pts+=o.pts||0;persist();updateHud()}
const showNext=()=>{const n=$('next');if(n){n.classList.remove('hidden');n.focus&&n.focus({preventScroll:true})}const hb=$('hintbtn');if(hb)hb.classList.add('hidden')};
const fbSet=(msg,good)=>{const f=$('fb');if(f){f.textContent=msg;f.className='fb '+(good?'good':'bad')}};
const hintSet=m=>{const h=$('hint');if(h)h.textContent=m};

/* ---------- STAGE 1 · Discover Words (garden) ---------- */
function q1(){
 const w=G.items[G.i];let type=['A','B','C'][G.i%3];if(type==='C'&&!canSpeak())type='A';G.type=type;
 const lab=x=>type==='A'?x.english:x.french,d=[];
 for(const x of shuffle(wordsOf(G.t,G.k).filter(y=>y.id!==w.id))){if(lab(x)!==lab(w)&&!d.some(y=>lab(y)===lab(x)))d.push(x);if(d.length===2)break}
 G.opts=shuffle([w,...d]);
 const spk=canSpeak()?`<button class="btn gold"${at('sayW')}>🔊 Hear it</button>`:'';
 const top=type==='A'?`<div class="prompt">What does this word mean?</div><div class="bigword">${esc(w.french)}</div>${spk}`
  :type==='B'?`<div class="prompt">Which French word means…</div><div class="bigword en">${esc(w.english)}</div>`
  :`<div class="prompt">Listen and find the word!</div><button class="btn gold big"${at('sayW')}>🔊 Listen</button>`;
 show(frame(`${top}<div class="opts3" id="opts">${G.opts.map((x,i)=>`<button class="opt c${i}" id="op${i}"${at('ans1',i)}>${esc(lab(x))}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="hint" id="hint"></div><div class="nextrow"><button class="btn big hidden" id="next"${at('next')}>Next ➜</button></div>`),'stage1');
 if(type!=='B')setTimeout(()=>say(w.french),400)}
function ans1(i){
 if(G.locked)return;const w=G.items[G.i],x=G.opts[i],ok=x.id===w.id,lab=G.type==='A'?w.english:w.french,btn=$('op'+i);
 if(ok){G.locked=true;const first=G.tries===0;btn.classList.add('good');chime(true);confetti(first?22:10);setKit('cheer',pick1(CHEER));
  finishItem(w,{ok:true,first,pts:first?10:5,credit:true});fbSet(first?'⭐ Perfect! +10 points':'Yes! +5 points',true);hintSet('');showNext()}
 else{G.tries++;btn.classList.add('bad');btn.disabled=true;chime(false);setKit('oops',pick1(OOPS));
  if(G.tries===1){const c=[...lab].find(ch=>/\p{L}/u.test(ch))||lab[0];hintSet(`💡 Hint: the answer starts with “${c}”`)}
  else{G.locked=true;G.opts.forEach((o,j)=>{if(o.id===w.id)$('op'+j).classList.add('good')});finishItem(w,{ok:false,first:false,pts:0,credit:false});fbSet(`The answer is “${lab}”. You'll see it again soon! 💕`,false);hintSet('');showNext()}}}

/* ---------- STAGE 2 · Spelling Adventure (castle) ---------- */
const CONF={e:['é','è','ê'],'é':['e','è'],'è':['e','é'],'ê':['e','é'],a:['à','â'],'à':['a','â'],'â':['a','à'],i:['î','ï'],o:['ô','e'],u:['ù','û'],c:['ç','s'],'ç':['c','s']};
function q2(){
 const w=G.items[G.i],chars=Array.from(NFC(w.french)),idxs=chars.map((c,i)=>/[\p{L}\p{N}]/u.test(c)?i:-1).filter(i=>i>=0);
 const missing=G.i%2===0&&idxs.length>=3;
 const slots=chars.map(c=>({c,sp:c===' ',fixed:false,ch:null,tid:null,lock:false,st:''}));
 let tc;
 if(missing){const k=Math.max(1,Math.min(4,Math.round(idxs.length*.4))),bl=new Set(shuffle(idxs.filter(i=>/[^\u0000-\u007f]/.test(chars[i]))).slice(0,2));
  for(const i of shuffle(idxs)){if(bl.size>=k)break;bl.add(i)}
  slots.forEach((s,i)=>{if(!s.sp&&!bl.has(i)){s.fixed=true;s.ch=s.c}});tc=[...bl].map(i=>chars[i]);
  const pool=shuffle([...new Set([...tc.flatMap(c=>CONF[c]||[]),...'aeiorlnstu'])].filter(x=>!tc.includes(x)));tc=tc.concat(pool.slice(0,idxs.length>6?3:2))}
 else tc=chars.filter(c=>c!==' ');
 let order=shuffle(tc);for(let n=0;n<6&&!missing&&order.join('')===tc.join('')&&new Set(tc).size>1;n++)order=shuffle(tc);
 G.sp={slots,tiles:order.map((c,id)=>({id,c,used:false})),missing};
 const spk=canSpeak()?`<button class="btn gold sm"${at('sayW')}>🔊 Hear it</button>`:'';
 show(frame(`<div class="prompt">${missing?'Fill in the missing letters ✏️':'Build the word with the letter tiles ✨'}</div><div class="clue"><span class="pill">English</span> <b>${esc(w.english)}</b> ${spk}</div><div id="spellArea"></div><div class="fb" id="fb"></div><div class="hint" id="hint"></div><div class="nextrow"><button class="btn alt" id="hintbtn"${at('hint2')}>💡 Help me</button><button class="btn big hidden" id="next"${at('next')}>Next ➜</button></div>`),'stage2');
 renderSpell();if(canSpeak())setTimeout(()=>say(w.french),400)}
function renderSpell(){const S=G.sp,a=$('spellArea');if(!a)return;
 a.innerHTML=`<div class="slots" id="slots">${S.slots.map((s,i)=>s.sp?'<span class="gap"></span>':`<button class="slot ${s.ch!==null?'f':''} ${s.fixed?'fixed':''} ${s.lock?'lock':''} ${s.st}"${at('unslot',i)}>${s.ch===null?'':esc(s.ch)}</button>`).join('')}</div><div class="tray" id="tray">${S.tiles.map(t=>`<button class="tile t${t.id%5}" id="tile${t.id}"${t.used?' disabled':''}${at('tile',t.id)}>${esc(t.c)}</button>`).join('')}</div>`}
const firstEmpty=()=>G.sp.slots.findIndex(s=>!s.sp&&!s.fixed&&s.ch===null);
function placeTile(id){if(G.locked)return;const S=G.sp,t=S.tiles.find(x=>x.id===id);if(!t||t.used)return;const i=firstEmpty();if(i<0)return;
 const s=S.slots[i];s.ch=t.c;s.tid=t.id;t.used=true;renderSpell();if(firstEmpty()<0)checkSpell()}
function unslot(i){if(G.locked)return;const S=G.sp,s=S.slots[i];if(!s||s.sp||s.fixed||s.lock||s.ch===null)return;const t=S.tiles.find(x=>x.id===s.tid);if(t)t.used=false;s.ch=null;s.tid=null;renderSpell()}
function hint2(){if(G.locked)return;const S=G.sp,i=firstEmpty();if(i<0)return;const s=S.slots[i];let t=S.tiles.find(x=>!x.used&&x.c===s.c);
 if(!t){const o=S.slots.find(x=>!x.sp&&!x.fixed&&!x.lock&&x.ch===s.c);if(o){const tt=S.tiles.find(x=>x.id===o.tid);if(tt)tt.used=false;o.ch=null;o.tid=null;t=S.tiles.find(x=>!x.used&&x.c===s.c)}}
 if(!t)return;t.used=true;s.ch=t.c;s.tid=t.id;s.lock=true;G.hints++;hintSet('💡 I placed a letter for you (this word is worth 5 points).');renderSpell();if(firstEmpty()<0)checkSpell()}
function checkSpell(){
 const w=G.items[G.i],S=G.sp,guess=S.slots.map(s=>s.sp?' ':s.ch).join('');
 if(guess===NFC(w.french)){G.locked=true;S.slots.forEach(s=>{if(!s.fixed&&!s.sp)s.st='good'});renderSpell();const clean=G.tries===0&&G.hints===0;
  chime(true);confetti(clean?24:10);setKit('cheer',pick1(CHEER));finishItem(w,{ok:true,first:clean,pts:clean?10:5,credit:G.hints<=1});fbSet(clean?'⭐ Perfect spelling! +10 points':'You spelled it! +5 points',true);if(canSpeak())say(w.french);showNext();return}
 G.tries++;G.locked=true;let accentIssue=false;
 S.slots.forEach(s=>{if(s.sp||s.fixed||s.lock)return;if(s.ch!==s.c){s.st='bad';if(/[^\u0000-\u007f]/.test(s.c)||/[^\u0000-\u007f]/.test(s.ch))accentIssue=true}else s.st='good'});
 renderSpell();chime(false);setKit('oops',pick1(OOPS));
 hintSet(accentIssue?'💡 Watch the accents: é è ê à ç':'💡 The red letters are not right yet.');
 if(G.tries===1)setTimeout(()=>{S.slots.forEach(s=>{if(s.sp||s.fixed||s.lock)return;if(s.st==='bad'){const t=S.tiles.find(x=>x.id===s.tid);if(t)t.used=false;s.ch=null;s.tid=null;s.st=''}else{s.lock=true;s.st=''}});G.locked=false;renderSpell()},1100);
 else setTimeout(()=>{S.slots.forEach(s=>{if(!s.sp){s.st=s.ch===s.c?'good':'reveal';s.ch=s.c}});renderSpell();finishItem(w,{ok:false,first:false,pts:0,credit:false});fbSet(`The word is “${w.french}”. You'll spell it next time! 💕`,false);hintSet('');showNext()},1000)}

/* ---------- STAGE 3 · Sentence Master (library) ---------- */
function candidates(f){const out=[];String(f).split('/').forEach(p=>{p=p.trim();const m=p.match(/^(.*?)\s*\((.*)\)$/);if(m){if(m[1])out.push(m[1]);if(m[2])out.push(m[2])}else if(p)out.push(p)});if(!out.includes(f))out.push(f);return[...new Set(out)].sort((a,b)=>b.length-a.length)}
const plainForm=f=>{const x=String(f).split('/')[0].replace(/\(.*?\)/g,'').trim();return x||f};
/* turn a French sentence into parts: text pieces and blanks (blank = the vocabulary word, exactly as written in the sentence) */
function sentModel(w,text){
 text=NFC(text);const cs=candidates(NFC(w.french));
 for(const c of cs){const rx=new RegExp('(^|[^\\p{L}\\p{N}])('+escRe(c).replace(/'/g,"['’]")+')'+(c.endsWith("'")?'':'(?![\\p{L}\\p{N}])'),'giu'),ms=[...text.matchAll(rx)];
  if(ms.length){const parts=[];let pos=0;for(const m of ms){const st=m.index+m[1].length;parts.push({t:text.slice(pos,st)});parts.push({b:m[2],acc:[m[2]]});pos=st+m[2].length}parts.push({t:text.slice(pos)});return{text,parts,fb:false}}}
 return{text,parts:[{t:text+'  '},{lab:1},{b:cs[0],acc:cs}],fb:true}}
const rebuild=m=>m.parts.map(p=>p.t!==undefined?p.t:p.lab?'':p.b).join('');
function q3(){
 const w=G.items[G.i],others=wordsOf(G.t,G.k).filter(x=>x.id!==w.id);
 G.models=w.sentences.map(t=>sentModel(w,t));G.checked=false;
 const spk=canSpeak();
 const cards=G.models.map((m,k)=>{
  const blanks=m.parts.filter(p=>p.b!==undefined),correct=m.fb?plainForm(w.french):blanks[0].b,cap=!m.fb&&m.parts[0].t.trim()==='';
  const acc=new Set(blanks.flatMap(b=>b.acc).map(nf));const ds=[];
  for(const x of shuffle(others)){let f=plainForm(x.french);if(cap)f=f.charAt(0).toUpperCase()+f.slice(1);if(!acc.has(nf(f))&&!ds.some(y=>nf(y)===nf(f)))ds.push(f);if(ds.length===2)break}
  m.opts=shuffle([correct,...ds]);let j=0;
  const line=m.parts.map(p=>p.t!==undefined?esc(p.t):p.lab?'<span class="lab">Écris le mot :</span> ':`<input class="blank" id="in-${k}-${j}" data-k="${k}" data-j="${j++}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Missing word" style="width:${Math.max(4.5,p.b.length+2)}ch">`).join('');
  return `<div class="scard" id="sc${k}"><span class="snum">${k+1}</span><div class="sline">${line}</div><div class="or">✍️ Type the word, or 👆 tap a choice</div><div class="opts" id="o${k}">${m.opts.map((o,n)=>`<button class="opt c${n}"${at('opt3',{k,v:o})}>${esc(o)}</button>`).join('')}</div><div class="srow">${spk?`<button class="btn alt sm" id="ls${k}"${at('listen3',k)}>🔊 Listen (beep)</button>`:''}<span class="res" id="res${k}"></span></div></div>`}).join('');
 show(frame(`<div class="prompt">Find the missing word <span class="pgn">· Page ${G.i+1} of ${G.items.length}</span></div><div class="clue"><span class="pill">Clue</span> the word means <b>${esc(w.english)}</b></div>${cards}<div class="fb" id="fb"></div><div class="nextrow"><button class="btn big" id="chk"${at('check3')}>✅ Check my answers</button><button class="btn big hidden" id="next"${at('next')}>${G.i+1>=G.items.length?'Finish 🏆':'Next page ➜'}</button></div>`),'stage3')}
function sayParts(parts){speechSynthesisCancel();const seq=[];parts.forEach(p=>{if(p.t!==undefined)seq.push(['s',p.t]);else if(p.b!==undefined)seq.push(['b'])});const run=i=>{if(i>=seq.length)return;const x=seq[i];if(x[0]==='b'){beep();setTimeout(()=>run(i+1),480)}else speak(x[1],()=>run(i+1))};run(0)}
function speechSynthesisCancel(){try{speechSynthesis.cancel()}catch(e){}}
function listen3(k){const m=G.models[k];if(G.checked||m.fb)say(rebuild(m).trim());else sayParts(m.parts)}
function opt3({k,v}){if(G.checked)return;document.querySelectorAll(`#sc${k} input.blank`).forEach(i=>{i.value=v});document.querySelectorAll(`#o${k} .opt`).forEach(b=>b.classList.toggle('on',b.textContent===v))}
function clear3(k){document.querySelectorAll(`#o${k} .opt`).forEach(b=>b.classList.remove('on'))}
function check3(){
 if(G.checked)return;const w=G.items[G.i];const ins=[...document.querySelectorAll('input.blank')];
 if(!ins.some(i=>i.value.trim())){fbSet('✍️ Type or tap a word first!',false);return}
 G.checked=true;G.locked=true;let right=0;
 G.models.forEach((m,k)=>{const bl=m.parts.filter(p=>p.b!==undefined);let all=true,tip=false;
  bl.forEach((b,j)=>{const el=$(`in-${k}-${j}`),v=el.value,ok=b.acc.some(a=>nf(a)===nf(v));el.readOnly=true;el.classList.add(ok?'ok':'bad');if(!ok){all=false;if(v.trim()&&b.acc.some(a=>noAccent(a)===noAccent(v)))tip=true;el.insertAdjacentHTML('afterend',`<span class="fix">✔ ${esc(b.acc[0])}</span>`)}});
  if(all)right++;document.querySelectorAll(`#o${k} .opt`).forEach(b=>b.disabled=true);
  $('res'+k).textContent=all?'⭐ Correct!':(tip?'Almost! Check the accents 👀':'Not quite — see the right word above');$('res'+k).className='res '+(all?'good':'bad');
  const ls=$('ls'+k);if(ls)ls.textContent='🔊 Read it all'});

function download(name,type,content){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const stamp=()=>today();
function backup(){download(`eva-world-backup-${stamp()}.json`,'application/json',JSON.stringify({app:'eva-world-of-words',exported:new Date().toISOString(),data},null,1))}
function exportCsv(){download(`eva-vocabulary-${stamp()}.csv`,'text/csv',toCsv([['Theme','Semaine','French Word','English Translation','French Sentence 1','French Sentence 2','French Sentence 3'],...data.words.slice().sort((a,b)=>a.theme-b.theme||a.week-b.week).map(w=>['Theme '+w.theme,'Semaine '+w.week,w.french,w.english,...(w.sentences||[])])]))}
function exportProg(){download(`eva-progress-${stamp()}.csv`,'text/csv',toCsv([['Theme','Semaine','French Word','Discover correct','Spelling correct','Sentence correct','Attempts','Correct','Wrong'],...data.words.map(w=>{const p=progRead(w);return['Theme '+w.theme,'Semaine '+w.week,w.french,p.d,p.s,p.n,p.att,p.ok,p.bad]})]))}
async function restore(){const f=$('rstfile').files[0];if(!f)return alert('Choose a backup (.json) file first.');
 try{const j=JSON.parse(await f.text()),d=j.data||j;if(!Array.isArray(d.words)||!d.words.length||typeof d.progress!=='object')throw Error('This is not an Eva backup file.');
  if(!confirm('Replace ALL current vocabulary and progress with this backup? This cannot be undone.'))return;data=Object.assign(fresh(),d);persist();parentPage();toast('Backup restored.')}catch(e){alert('Restore failed: '+e.message)}}
function resetWeek(){const t=+$('rTheme').value,k=+$('rWeek').value;if(!k)return;if(!confirm(`Reset all progress and stars for Theme ${t} · Semaine ${k}? This cannot be undone.`))return;
 data.words.filter(w=>w.theme===t&&w.week===k).forEach(w=>delete data.progress[w.id]);[1,2,3].forEach(s=>delete data.stageBest[skey(t,k,s)]);persist();toast(`Theme ${t} · Semaine ${k} was reset.`)}
function resetVocab(){if(!confirm('Replace the vocabulary with the original workbook words? Words you added or edited will be lost. Progress for the original words is kept.'))return;data.words=seedWords();persist();parentPage();toast('Original vocabulary restored.')}
function saveSettings(){data.voice=$('voice').value;data.sound=$('snd').value==='1';const p=$('newpin').value;if(p){if(p.length<4)return alert('The PIN needs at least 4 characters.');data.pin=p}persist();updateHud();toast('Settings saved.')}
function testVoice(){if(canSpeak())say('Bonjour Eva! Bienvenue dans ton monde des mots.');else alert('No French voice was found on this device. Eva can still play: she will read the words.')}
function assign(){const d=$('adate').value,t=+$('aTheme').value,k=+$('aWeek').value;if(!d||!k)return alert('Choose a date, a Theme and a Semaine.');data.assign[d]={t,k};persist();toast('Mission assigned.')}

/* ======================  MAIN: events + start  ====================== */
const ACT={
 goHome:()=>{G=null;home()},goPlay:()=>{G=null;themeSelect()},goTheme:t=>{G=null;weekSelect(+t)},goWeek:p=>{G=null;stageSelect(p.t,p.k)},
 play:startStage,goProgress:progressPage,goTreasures:treasures,equip:id=>{data.equipped=id;persist();treasures()},
 sayW:()=>{if(G)say(G.items[G.i].french)},ans1,next:()=>{if(!G)return;G.i++;renderQ()},tile:placeTile,unslot,hint2,opt3,check3,listen3,exitGame,
 closeModal,toggleSound:()=>{data.sound=!data.sound;persist();updateHud()},goParent:()=>{G=null;parentLogin()},
 pinGo,importPreview,approveImport,cancelImport:()=>{pending=null;$('preview').innerHTML=''},reviewCsv,editWord,saveWord,delWord,backup,exportCsv,exportProg,restore,resetWeek,resetVocab,saveSettings,testVoice,assign
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(!f)return;let p;if(el.dataset.p!==undefined){try{p=JSON.parse(el.dataset.p)}catch(_){}}audio();f(p,el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el)return;const c=el.dataset.c;
 if(c==='pzFilter')pzFilter();else if(c==='rTheme')fillWeeks('rWeek',el.value);else if(c==='aTheme')fillWeeks('aWeek',el.value);else if(c==='upd'){const r=pending&&pending.recs.find(x=>x.row===+el.dataset.r);if(r)r.update=el.checked}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fQ')pzFilter();if(t.classList&&t.classList.contains('blank'))clear3(+t.dataset.k)});
document.addEventListener('keydown',e=>{const t=e.target,tag=t.tagName;
 if(t.classList&&t.classList.contains('blank')&&e.key==='Enter'){e.preventDefault();const all=[...document.querySelectorAll('input.blank')],i=all.indexOf(t);if(G&&!G.checked){if(all[i+1])all[i+1].focus();else check3()}return}
 if(t.id==='pin'&&e.key==='Enter'){pinGo();return}
 if(e.key==='Escape'&&$('modal').classList.contains('on')){closeModal();return}
 if(G&&G.s===2&&G.sp&&!G.locked&&!/INPUT|TEXTAREA|SELECT/.test(tag)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
  if(e.key==='Backspace'){const f=G.sp.slots.map((s,i)=>(!s.sp&&!s.fixed&&!s.lock&&s.ch!==null)?i:-1).filter(i=>i>=0);if(f.length){e.preventDefault();unslot(f[f.length-1])}}
  else if(e.key.length===1&&e.key!==' '){const tile=G.sp.tiles.find(x=>!x.used&&x.c.toLowerCase()===e.key.toLowerCase());if(tile)placeTile(tile.id)}}});
window.addEventListener('DOMContentLoaded',()=>{$('logo').innerHTML=kitten({who:'mimi',acc:'collar',mood:'happy'});home()});

</script>
</body>
</html>
